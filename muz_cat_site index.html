<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muz•Cat — музыка в тёмном свете</title>
  <meta name="description" content="Muz•Cat — музыкальный Telegram-канал. Музыка, треки, настроение и подборки. Подписывайся и слушай вместе с нами.">
  <meta name="keywords" content="MuzCat, Muz Cat, Muz•Cat, музыка, музыкальный канал, Telegram музыка, новые треки, песни, музыкальные подборки, музыка 2026">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#09090d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Muz•Cat — музыка в тёмном свете">
  <meta property="og:description" content="Музыка, которая попадает в настроение. Заходи в Telegram Muz•Cat.">
  <meta property="og:url" content="https://t.me/muzz_cat">
  <style>
    :root { color-scheme: dark; --bg:#08080c; --panel:#111119; --text:#f5f5f7; --muted:#a5a5b4; --accent:#b9a0ff; --accent2:#7b5cff; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(123,92,255,.22), transparent 45%),
        radial-gradient(ellipse at 80% 80%, rgba(185,160,255,.08), transparent 35%), var(--bg);
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .wrap { width:min(760px,100%); }
    .top { display:flex; align-items:center; gap:12px; margin-bottom:34px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; font-size:12px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px var(--accent); }
    .card {
      position:relative; overflow:hidden; padding:clamp(28px,7vw,64px);
      border:1px solid rgba(255,255,255,.10); border-radius:28px;
      background:linear-gradient(145deg,rgba(24,24,35,.94),rgba(10,10,15,.96));
      box-shadow:0 30px 100px rgba(0,0,0,.55);
    }
    .card:before { content:""; position:absolute; width:320px; height:320px; right:-120px; top:-130px; border-radius:50%; background:rgba(123,92,255,.18); filter:blur(60px); }
    .equalizer { display:flex; align-items:center; gap:5px; height:34px; margin-bottom:25px; }
    .equalizer span { width:5px; border-radius:9px; background:linear-gradient(var(--accent),var(--accent2)); animation:beat 1s ease-in-out infinite alternate; }
    .equalizer span:nth-child(1){height:13px}.equalizer span:nth-child(2){height:25px;animation-delay:.15s}.equalizer span:nth-child(3){height:18px;animation-delay:.3s}.equalizer span:nth-child(4){height:32px;animation-delay:.45s}.equalizer span:nth-child(5){height:15px;animation-delay:.6s}
    @keyframes beat { to { transform:scaleY(.45); opacity:.65; } }
    h1 { position:relative; margin:0; font-size:clamp(42px,9vw,76px); letter-spacing:-.06em; line-height:1; }
    h1 span { color:var(--accent); }
    .subtitle { position:relative; margin:20px 0 0; font-size:clamp(17px,3vw,22px); color:#d8d6e4; }
    .desc { max-width:520px; margin:16px 0 32px; color:var(--muted); line-height:1.7; }
    .btn {
      display:inline-flex; align-items:center; gap:10px; padding:15px 23px; border-radius:14px;
      color:#09080e; font-weight:750; text-decoration:none; background:linear-gradient(135deg,#d4c5ff,#9b7dff);
      box-shadow:0 8px 30px rgba(123,92,255,.25); transition:transform .2s,box-shadow .2s;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 12px 38px rgba(123,92,255,.4); }
    .note { margin-top:22px; color:#777785; font-size:12px; }
    footer { text-align:center; margin-top:22px; color:#666674; font-size:12px; }
    @media(prefers-reduced-motion:reduce){.equalizer span{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><span class="dot"></span> music • mood • night</div>
    <section class="card">
      <div class="equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <h1>Muz<span>•</span>Cat</h1>
      <p class="subtitle">Музыка в тёмном свете.</p>
      <p class="desc">Треки, настроение и музыка, которая остаётся с тобой. Загляни в наш Telegram-канал — включай звук и находи свой вайб.</p>
      <a class="btn" href="https://t.me/muzz_cat" target="_blank" rel="noopener noreferrer">
        <span>↗</span> Открыть Telegram-канал
      </a>
      <div class="note">t.me/muzz_cat</div>
    </section>
    <footer>© Muz•Cat — слушай настроение.</footer>
  </main>
</body>
</html>
